name: Playwright Chromium Extension Smoke Test
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: playwright-smoke
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save playwright@1.58.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke test
        run: xvfb-run -a node tests/playwright-smoke.mjs
      - name: Upload browser test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: test-results/playwright-smoke/
          if-no-files-found: warn
          retention-days: 7
